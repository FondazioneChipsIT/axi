.run_vsim: &run_vsim
  stage: test
  needs:
    - vsim
  script:
    - export ARTIFACT="$TEST_MODULE-vsim_$VSIM_VER"
    - cd build
    - ../scripts/run_vsim.sh --random-seed "$TEST_MODULE"
    - touch "$ARTIFACT.tested"
  parallel:
    matrix:
      - VSIM_VER: ['2025.3']

axi_addr_test:
  <<: *run_vsim
  variables:
    TEST_MODULE: axi_addr_test

