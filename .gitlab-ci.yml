variables:
  # SYNOPSYS_DC: synopsys-2022.03 dcnxt_shell
  QuestaModule:     "questa/2025.3"
  BenderModule:     "bender/0.28.2"

before_script:
  - module purge
  - module load ${BenderModule} ${QuestaModule}
  - module list
  - mkdir -p build

vsim:
  stage: build
  script:
    - echo "Running VSIM job with VSIM_VER='$VSIM_VER'"
    - export ARTIFACT="vsim-$VSIM_VER"
    - >
      cd build && ../scripts/compile_vsim.sh 
  artifacts:
    paths:
      - build/work
    expire_in: 1h

